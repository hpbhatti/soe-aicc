<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Technical brief for 700Apps</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1B5E20;--gd:#0D3B13;--gl:#7CB342;--soft:#E8F5E9;--rule:#D7E1D4;--ink:#1A1A1A;--mut:#5F6F62;--bg:#F4F7F3;--red:#B91C1C;--in:#1D4ED8;--ins:#DBEAFE;--out:#B45309;--outs:#FEF3C7}
*{box-sizing:border-box}body{margin:0;font:14.5px/1.55 Cairo,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.hd{background:var(--g);color:#fff;border-bottom:5px solid var(--gl);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.hd img{height:42px}.hd .r{text-align:right}.hd b{font-size:19px;display:block}.hd small{opacity:.9;font-size:12.5px}
main{max-width:1040px;margin:0 auto;padding:6px 16px 70px}
.sec{margin:26px 0 0}.kick{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--g);text-transform:uppercase}.sec h2{font-size:24px;margin:2px 0 4px;color:var(--ink)}.sub{color:var(--mut);margin:2px 0 12px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.task{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:flex;gap:10px}.task i{flex:0 0 24px;height:24px;border-radius:50%;background:var(--g);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px}.task b{display:block}.task span{font-size:13px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}.tile{background:var(--g);color:#fff;border-radius:10px;border-left:6px solid var(--gl);padding:10px 12px}.tile b{display:block;font-size:22px;line-height:1.15}.tile span{font-size:12px;opacity:.92}
.strip{background:var(--soft);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;margin:10px 0}.strip i{font-style:normal;font-size:28px;font-weight:800;color:var(--g)}.strip b{display:block}.strip span{color:var(--mut);font-size:13px}
.tag{display:inline-block;border-radius:20px;padding:1px 10px;font-size:11.5px;font-weight:800}.tag.bi{background:#C5E1A5;color:var(--gd)}.tag.ep{background:#DBEAFE;color:#1E3A8A}.tag.so{background:#E5ECE2;color:var(--gd)}
.chip{display:inline-block;background:var(--soft);border-radius:8px;padding:0 8px;margin:1px 2px;font-weight:700;font-size:12.5px}.chip.op{background:none;color:var(--gl);padding:0 2px}
.bd{display:inline-block;border-radius:6px;padding:0 8px;font-size:11px;font-weight:800;letter-spacing:.05em;vertical-align:middle}.bd.in{background:var(--ins);color:var(--in)}.bd.out{background:var(--outs);color:var(--out)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden}th{background:var(--soft);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;color:var(--gd)}td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}td small{display:block;color:var(--mut);font-size:12px}.r{text-align:right;white-space:nowrap}tr.tot td{background:var(--soft);font-weight:800}
.a3{display:grid;grid-template-columns:210px 1fr 230px;gap:16px;align-items:center}.a3h{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--g);margin-bottom:8px}
.nd{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;margin-bottom:8px}.nd .ic{flex:0 0 30px;height:30px;border-radius:8px;background:var(--soft);color:var(--g);display:flex;align-items:center;justify-content:center}.nd .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nd b{display:block;font-size:13.5px;line-height:1.3}.nd small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.nd.wa{border-color:#25D36688}.nd.sy{border-color:#2563EB66}.ar{text-align:center;color:var(--gl);font-weight:800;line-height:1;margin:-2px 0 6px}
.pn{background:var(--soft);border:2px solid #A5D6A7;border-radius:16px;padding:12px}.pn .nd{margin-bottom:8px}.fl2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.fl2>div{background:#fff;border-radius:10px;padding:10px}.fh{font-size:11px;font-weight:800;letter-spacing:.08em;margin-bottom:6px}.fh.in{color:var(--in)}.fh.out{color:var(--out)}
.f1{font-size:13px;padding:3px 0 3px 12px;position:relative;font-weight:600}.f1:before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--g)}.f1 small{display:block;font-weight:600;color:var(--g);font-size:11.5px}.f1 small.v{color:var(--mut);font-weight:400}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vrow{margin:10px 0 4px;display:flex;align-items:center;gap:8px;font-weight:800}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:6px 0 10px}.chain>div{flex:1;min-width:96px;border:1.5px solid var(--rule);border-radius:10px;padding:8px 6px;text-align:center;background:#fff}.chain b{display:block;font-size:21px;color:var(--g);line-height:1.1}.chain span{font-size:11.5px;color:var(--mut)}
.chain .op{flex:0 0 auto;min-width:0;border:0;background:none;padding:0;align-self:center;font-size:20px;font-weight:800;color:var(--gl)}.chain .res{background:var(--g);border-color:var(--g)}.chain .res b,.chain .res span{color:#fff}
.chain.in>div:not(.op):not(.res){border-top:4px solid var(--in)}.chain.out>div:not(.op):not(.res){border-top:4px solid var(--out)}.chain.in .res{background:var(--in);border-color:var(--in)}.chain.out .res{background:var(--out);border-color:var(--out)}
.bar{height:9px;background:#E5ECE2;border-radius:6px;max-width:420px;margin:6px 0}.bar i{display:block;height:100%;background:var(--gl);border-radius:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 14px}.box{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:12px 14px}.box h4{margin:0 0 8px;color:var(--g);font-size:14px}
.lad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.lad>div{border:1.5px solid var(--rule);border-radius:10px;padding:6px 2px;text-align:center;background:#fff}.lad b{display:block;font-size:12px;color:var(--mut)}.lad span{display:block;font-size:10.5px;color:var(--mut)}.lad em{font-style:normal;font-weight:800;color:var(--g);font-size:15px}
.lad>div.pk{background:var(--g);border-color:var(--g)}.lad>div.pk b,.lad>div.pk span,.lad>div.pk em{color:#fff}
.mut{color:var(--mut);font-size:12.5px}
.q{background:#FFFBEB;border:1.5px solid #F5DD9A;border-radius:12px;padding:12px 16px}.q ol{margin:0;padding-left:20px}.q li{margin:8px 0}.q textarea{margin-top:4px}
.how{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:12px 16px;margin-top:12px}.how b{color:var(--g)}
.card{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin:14px 0}
.seg button{font:inherit;font-size:12.5px;padding:3px 10px;border-radius:8px;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer;margin:0 4px 2px 0}.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
input,textarea{font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;width:100%}input[type=number]{width:130px}
.go{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:800;cursor:pointer}.go[disabled]{opacity:.5}
.lnk{border:0;background:none;color:var(--g);text-decoration:underline;cursor:pointer;font:inherit;padding:0;margin-top:8px}
.err{color:var(--red);font-weight:700;min-height:20px}.ok{background:var(--soft);border:1px solid var(--rule);border-radius:12px;padding:24px;text-align:center}
.ft{margin-top:26px;border-top:1px solid var(--rule);padding-top:8px;font-size:12px;color:var(--mut)}
.chips span{display:inline-block;background:var(--soft);border:1px solid var(--rule);border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0;font-size:13px}
@media(max-width:820px){.cards3,.pair{grid-template-columns:1fr}.a3{grid-template-columns:1fr}.mods,.fl2{grid-template-columns:1fr}.lad{grid-template-columns:repeat(3,1fr)}td:nth-child(2){min-width:150px}}
</style>
</head>
