<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Contact Center — Your Solution Journey (prototype 5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--deep:#1B5E20;--dark:#0D3B13;--lime:#7CB342;--soft:#E8F5E9;--ink:#1A1A1A;--mute:#5F6F62;--rule:#D7E1D4;--amber:#F59E0B;--blue:#2563EB;--wa:#25D366;--bg:#F5F8F5;--card:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:84px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font-family:inherit;cursor:pointer}
/* header */
.hd{background:linear-gradient(135deg,var(--dark),var(--deep));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.hd-in{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.hd img{height:30px;width:auto}
.hd .cl{margin-left:auto;text-align:right;line-height:1.2}
.hd .cl b{font-size:.92rem;display:block}
.hd .cl span{font-size:.66rem;opacity:.65;letter-spacing:.04em}
.prog{max-width:1040px;margin:0 auto;padding:0 20px 12px;display:flex;gap:6px}
.pstep{flex:1;background:none;border:none;color:rgba(255,255,255,.55);text-align:left;padding:0}
.pstep .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-bottom:6px;overflow:hidden}
.pstep .bar i{display:block;height:100%;width:0;background:var(--lime);transition:width .4s}
.pstep.done .bar i,.pstep.on .bar i{width:100%}
.pstep.on{color:#fff}
.pstep .nm{font-size:.68rem;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* stage */
main{max-width:1040px;margin:0 auto;padding:28px 20px}
.kick{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--deep);margin-bottom:6px}
h2.t{font-size:1.7rem;font-weight:800;line-height:1.2;letter-spacing:-.01em;margin-bottom:8px}
p.lead{color:var(--mute);font-size:1rem;max-width:660px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(27,94,32,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ic{width:42px;height:42px;border-radius:11px;background:var(--soft);color:var(--deep);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row{display:flex;gap:12px;align-items:flex-start}
.row b{display:block;font-size:.95rem}
.row span{font-size:.82rem;color:var(--mute)}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* step 1 */
.hero{background:linear-gradient(135deg,var(--dark),var(--deep) 60%,#2E7D32);color:#fff;border-radius:18px;padding:30px 28px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(124,179,66,.18)}
.hero h2{font-size:1.9rem;font-weight:800;line-height:1.2;position:relative}
.hero p{opacity:.8;margin-top:8px;max-width:560px;position:relative}
.goal{display:flex;gap:12px;align-items:center}
.goal .ic{background:var(--deep);color:#fff}
.pain{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;padding:10px 0;border-bottom:1px solid var(--rule)}
.pain:last-child{border:none}
.pain svg{color:var(--amber);margin-top:2px;width:18px;height:18px}
/* step 2 */
.gh{font-size:.78rem;font-weight:700;color:var(--deep);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.gh::after{content:'';flex:1;height:1px;background:var(--rule)}
.fc{display:flex;gap:12px;align-items:center;padding:14px;background:#fff;border:1px solid var(--rule);border-radius:12px}
.fc.out .ic{background:#FEF3C7;color:#92400E}
.fc .code{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--mute)}
.fc b{font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;background:var(--soft);border-radius:30px;font-size:.78rem;font-weight:600;color:var(--deep)}
.chip svg{width:15px;height:15px}
/* step 3 sim */
.sim{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pk{padding:8px 14px;border-radius:30px;border:1.5px solid var(--rule);background:#fff;font-size:.8rem;font-weight:600;color:var(--ink)}
.pk.on{background:var(--deep);border-color:var(--deep);color:#fff}
.pk.o.on{background:#92400E;border-color:#92400E}
.pipe{display:flex;flex-direction:column;gap:0}
.ps{display:flex;gap:12px;padding:12px 0;position:relative;opacity:.4;transition:opacity .3s}
.ps:not(:last-child)::before{content:'';position:absolute;left:19px;top:44px;bottom:-8px;width:2px;background:var(--rule)}
.ps.on{opacity:1}
.ps .n{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0;transition:all .3s}
.ps.on .n{background:var(--deep);color:#fff;box-shadow:0 0 0 5px rgba(27,94,32,.15)}
.ps b{font-size:.9rem;display:block}
.ps span{font-size:.78rem;color:var(--mute)}
.sysbadge{display:inline-block;margin-top:4px;font-size:.68rem;font-weight:700;background:#DBEAFE;color:var(--blue);padding:2px 9px;border-radius:20px}
.phone{background:#0f1a10;border-radius:34px;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.28);position:sticky;top:130px}
.scr{background:#EFEAE2;border-radius:24px;overflow:hidden;height:470px;display:flex;flex-direction:column}
.ph-top{background:var(--deep);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.ph-top .av{width:30px;height:30px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center}
.ph-top b{font-size:.78rem;display:block;line-height:1.1}
.ph-top span{font-size:.62rem;opacity:.7}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:84%;padding:8px 11px;border-radius:12px;font-size:.78rem;line-height:1.4;animation:fade .3s both}
.m.ai{background:#fff;align-self:flex-start;border-top-left-radius:3px}
.m.cu{background:#DCF8C6;align-self:flex-end;border-top-right-radius:3px}
.m small{display:block;font-size:.6rem;color:var(--mute);margin-bottom:2px;font-weight:700;letter-spacing:.04em}
.ph-bot{padding:10px;background:#F7F4EE;text-align:center}
.play{background:var(--deep);color:#fff;border:none;border-radius:30px;padding:9px 20px;font-weight:700;font-size:.8rem;display:inline-flex;gap:6px;align-items:center}
.play svg{width:14px;height:14px;fill:#fff;stroke:none}
.cap{text-align:center;font-size:.66rem;color:#9AA89C;margin-top:8px}
/* step 4 */
.arch{display:grid;grid-template-columns:1fr 40px 1.1fr 40px 1fr;align-items:center;gap:0}
.col{display:flex;flex-direction:column;gap:10px}
.nd{background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:.85rem;font-weight:600}
.nd .ic{width:34px;height:34px;border-radius:9px}
.nd .ic svg{width:18px;height:18px}
.nd small{display:block;font-size:.66rem;color:var(--mute);font-weight:400}
.core{background:linear-gradient(160deg,var(--dark),var(--deep));color:#fff;border-radius:16px;padding:22px 18px;text-align:center;box-shadow:0 10px 30px rgba(27,94,32,.35)}
.core .ic{background:rgba(255,255,255,.15);color:#fff;margin:0 auto 10px;width:52px;height:52px}
.core b{font-size:1.05rem;display:block}
.core span{font-size:.74rem;opacity:.75}
.core ul{list-style:none;margin-top:12px;text-align:left;font-size:.74rem}
.core li{padding:4px 0;display:flex;gap:7px;align-items:center}
.core li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--lime)}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--lime)}
.arrow svg{width:30px;height:30px}
.hand{margin-top:14px;display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:12px;padding:12px 16px;font-size:.84rem}
/* step 5 */
.il{display:inline-block;background:#FEF3C7;color:#92400E;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:14px;position:relative}
.kpi .v{font-size:1.6rem;font-weight:800;color:var(--deep);line-height:1}
.kpi .l{font-size:.72rem;color:var(--mute);margin-top:4px}
.kpi.goal{border-color:var(--lime);background:linear-gradient(180deg,#fff,var(--soft))}
.kpi .tag{position:absolute;top:-9px;right:10px;background:var(--lime);color:#fff;font-size:.6rem;font-weight:700;padding:2px 9px;border-radius:20px}
.charts{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.bars{display:flex;align-items:flex-end;gap:7px;height:150px;margin-top:10px}
.bars div{flex:1;background:linear-gradient(180deg,var(--lime),var(--deep));border-radius:5px 5px 0 0;position:relative;min-height:6px}
.bars div span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:.58rem;color:var(--mute)}
.donut{width:130px;height:130px;border-radius:50%;margin:10px auto;position:relative}
.donut::after{content:'';position:absolute;inset:26px;background:#fff;border-radius:50%}
.lg{font-size:.72rem;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center}
.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.ct{font-size:.8rem;font-weight:700}
/* step 6 */
.paths{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.path{background:#fff;border:1.5px solid var(--rule);border-radius:16px;padding:22px;transition:border-color .2s}
.path:hover{border-color:var(--lime)}
.path h3{font-size:1.1rem;margin:10px 0 4px}
.path p{font-size:.84rem;color:var(--mute);margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--rule);border-radius:11px;padding:11px 13px;margin-bottom:9px;font-size:.88rem;font-weight:700;color:var(--ink);transition:all .2s}
.opt:hover{border-color:var(--deep);background:var(--soft)}
.opt .ic{width:34px;height:34px}
.opt small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
.opt.pri{background:var(--deep);border-color:var(--deep);color:#fff}
.opt.pri small{color:rgba(255,255,255,.7)}
.opt.pri .ic{background:rgba(255,255,255,.18);color:#fff}
.opt.pri:hover{background:var(--dark)}
.back{background:none;border:none;color:var(--mute);font-size:.8rem;margin-bottom:12px;display:inline-flex;gap:5px;align-items:center}
.back svg{width:14px;height:14px}
.fm label{display:block;font-size:.7rem;font-weight:700;color:var(--mute);letter-spacing:.05em;text-transform:uppercase;margin:12px 0 5px}
.fm input,.fm select,.fm textarea{width:100%;padding:11px 13px;border:1.5px solid var(--rule);border-radius:10px;font-family:inherit;font-size:.88rem;background:var(--bg)}
.fm input:focus,.fm select:focus,.fm textarea:focus{outline:none;border-color:var(--deep);background:#fff}
.fm .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cons{display:flex;gap:9px;align-items:flex-start;font-size:.76rem;color:var(--mute);margin:14px 0}
.cons input{width:auto;margin-top:3px}
.btn{background:linear-gradient(135deg,var(--deep),#2E7D32);color:#fff;border:none;border-radius:10px;padding:13px 22px;font-weight:700;font-size:.9rem;box-shadow:0 4px 14px rgba(27,94,32,.28)}
.btn.ghost{background:#fff;color:var(--deep);border:1.5px solid var(--deep);box-shadow:none}
.err{display:none;background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:8px;padding:9px 12px;font-size:.78rem;margin-top:10px}
.sc{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;margin-bottom:8px;background:#fff;font-size:.86rem}
.sc input{width:18px;height:18px;accent-color:var(--deep)}
.sc .need{margin-left:auto;font-size:.66rem;font-weight:700;background:#FEF3C7;color:#92400E;padding:2px 9px;border-radius:20px}
.sc .new{font-size:.62rem;background:var(--lime);color:#fff;padding:2px 8px;border-radius:20px;font-weight:700}
.addrow{display:flex;gap:8px;margin:6px 0 14px}
.addrow select,.addrow input{flex:1}
.addrow button{padding:0 16px;border-radius:10px;border:1.5px solid var(--deep);background:#fff;color:var(--deep);font-weight:700;font-size:.8rem}
.note{font-size:.76rem;color:var(--mute);background:var(--soft);border-radius:9px;padding:9px 12px;margin:10px 0}
.track{display:flex;gap:0;margin:6px 0 16px}
.tk{flex:1;text-align:center;font-size:.72rem;font-weight:700;color:var(--mute);position:relative;padding-top:26px}
.tk::before{content:'';position:absolute;top:8px;left:0;right:0;height:3px;background:var(--rule)}
.tk::after{content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--rule)}
.tk.on{color:var(--deep)}
.tk.on::before{background:var(--lime)}
.tk.on::after{background:var(--deep);border-color:var(--lime)}
.tk:first-child::before{left:50%}.tk:last-child::before{right:50%}
.done{text-align:center;padding:10px 0}
.done .ok{width:62px;height:62px;border-radius:50%;background:var(--soft);color:var(--deep);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.done .ok svg{width:32px;height:32px}
.sum{background:var(--bg);border-radius:12px;padding:14px 16px;text-align:left;margin:16px auto;max-width:480px;font-size:.84rem}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--rule)}
.sum div:last-child{border:none}
.sum span{color:var(--mute)}
.tl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.tl button{padding:8px 14px;border-radius:30px;border:1.5px solid var(--rule);background:#fff;font-size:.78rem;font-weight:600}
.tl button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.wa{display:inline-flex;gap:8px;align-items:center;background:var(--wa);color:#fff;text-decoration:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:.85rem}
.people{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.pe{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px;display:flex;gap:12px}
.pe .av{width:46px;height:46px;border-radius:50%;background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.pe b{font-size:.92rem;display:block;line-height:1.2}
.pe .ds{font-size:.74rem;color:var(--mute);margin-bottom:5px}
.pe a{display:block;font-size:.78rem;color:var(--deep);text-decoration:none;font-weight:600}
.pe .main{display:inline-block;background:var(--lime);color:#fff;font-size:.58rem;font-weight:700;padding:1px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--rule);z-index:20}
.nav-in{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.nav .cnt{font-size:.75rem;color:var(--mute)}
/* prototype bar */
.pb{position:fixed;left:12px;bottom:78px;z-index:30;background:#111;color:#fff;border-radius:12px;padding:9px 12px;font-size:.7rem;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:260px}
.pb b{display:block;color:var(--lime);letter-spacing:.08em;font-size:.62rem;margin-bottom:5px}
.pb button{background:#333;color:#fff;border:none;border-radius:6px;padding:4px 9px;font-size:.68rem;margin:2px 2px 0 0}
.pb button.on{background:var(--lime)}

.hd .cu{margin-left:auto;display:flex;align-items:center;gap:10px;text-align:right}
.hd .cu small{display:block;font-size:.58rem;opacity:.6;letter-spacing:.08em;text-transform:uppercase}
.hd .cu b{font-size:.88rem;line-height:1.1;display:block}
.clogo{width:36px;height:36px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.clogo svg{width:28px;height:28px}.clogo.has{width:auto;height:auto;min-width:44px;max-width:170px;padding:5px 9px}.clogo.has img{max-height:46px;max-width:150px;object-fit:contain;display:block}.lgs .clogo.has{width:auto;height:auto;min-width:0;max-width:260px;padding:10px 18px;border-radius:15px;overflow:visible}.lgs .clogo.has img{max-height:64px;max-width:220px;width:auto;height:auto}.a3b.nat{border-color:var(--lime)}.a3b.nat .ic{background:var(--soft);color:var(--deep)}
/* cover */
.cover{min-height:calc(100vh - 150px);display:flex;align-items:center;justify-content:center}
.cv{width:100%;max-width:820px;text-align:center;background:linear-gradient(145deg,var(--dark),var(--deep) 65%,#2E7D32);color:#fff;border-radius:24px;padding:46px 34px;position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(13,59,19,.35)}
.cv::before{content:'';position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:rgba(124,179,66,.16)}
.cv::after{content:'';position:absolute;left:-70px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:rgba(124,179,66,.1)}
.cv *{position:relative;z-index:1}
.lgs{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:26px}
.lgs img{height:46px}
.lgs .x{opacity:.5;font-size:1.3rem}
.lgs .clogo{width:62px;height:62px;border-radius:15px}
.lgs .clogo svg{width:46px;height:46px}
.cv h1{font-size:2.1rem;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.cv h1 em{font-style:normal;color:#B6DB8A}
.cv p{opacity:.8;max-width:520px;margin:12px auto 26px}
.cv .btn{background:#fff;color:var(--deep);font-size:1rem;padding:14px 30px}
.cv .meta{margin-top:18px;font-size:.72rem;opacity:.55;letter-spacing:.04em}
/* tags */
.use{display:inline-block;margin-top:3px;font-size:.64rem;font-weight:700;background:#DBEAFE;color:var(--blue);padding:1px 8px;border-radius:20px}
.cnt{font-size:.78rem}
.sysh{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.sysh .big{font-size:1.8rem;font-weight:800;color:var(--deep);line-height:1}
/* call screen */
.scr.call{background:linear-gradient(180deg,#0B2A10,#12401A 55%,#0B2A10);color:#fff;height:540px;align-items:center;text-align:center;padding:16px 14px;position:relative}
.cl-top{width:100%;display:flex;justify-content:space-between;font-size:.66rem;letter-spacing:.08em;opacity:.8;text-transform:uppercase;align-items:center}
.cl-top .rec{display:inline-block;width:8px;height:8px;border-radius:50%;background:#EF4444;margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.ava{position:relative;width:92px;height:92px;margin:16px auto 8px;display:flex;align-items:center;justify-content:center}
.ava .core{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--lime),var(--deep));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 24px rgba(124,179,66,.5);z-index:2;margin:0}
.ava .core svg{width:32px;height:32px}
.ava .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(124,179,66,.5);opacity:0}
.ava.on .ring{animation:ring 1.6s ease-out infinite}
.ava.on .ring.r2{animation-delay:.8s}
@keyframes ring{from{transform:scale(.75);opacity:.9}to{transform:scale(1.35);opacity:0}}
.scr.call b.nm{font-size:.95rem}
.scr.call small.sub{opacity:.6;font-size:.7rem}
.wave{display:flex;gap:3px;align-items:center;justify-content:center;height:46px;margin:12px 0 6px}

.stp .pipe .ps b{font-size:.8rem}.stp .pipe .ps span{font-size:.68rem;display:none}
.stp .pipe .ps.cur span{display:block}
.stp .pipe .ps.done{opacity:.85}.stp .pipe .ps.done .n{background:var(--lime);color:#0D3B13;box-shadow:none}
.stp .pipe .ps.cur{opacity:1;background:var(--soft);padding:8px 8px;margin:0 -8px}
.stp .pipe .ps.cur .n{background:var(--deep);color:#fff;box-shadow:0 0 0 4px rgba(27,94,32,.18)}
.stp .pipe .ps .tg{font-size:.56rem;padding:2px 7px}
.rcol{scroll-margin-top:128px}.stp,.stp .pipe,.stp .pipe .ps>div{text-align:left!important}.rcol .wave{margin-bottom:8px}.rcol .cap{margin-top:8px}
.rcol .scr.call{height:392px;padding:10px 12px}
.rcol .ava{width:66px;height:66px;margin:8px auto 4px}.rcol .ava .core{width:48px;height:48px}.rcol .ava .core svg{width:24px;height:24px}
.rcol .wave{height:30px;margin:6px 0 2px}.rcol .cap2{min-height:58px;margin-top:4px;font-size:.84rem}.rcol .pop{min-height:62px}
.rcol .pc{padding:8px 10px}

/* v4: customised dashboard */
.cstrip{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.cstrip>div{flex:1;min-width:150px;background:linear-gradient(135deg,var(--dark),var(--deep));color:#fff;border-radius:12px;padding:12px 16px}
.cstrip b{display:block;font-size:1.5rem;line-height:1.1}.cstrip span{font-size:.7rem;opacity:.8}
.tier{display:flex;align-items:center;gap:12px;border:none;padding:0;margin:26px 0 12px;font-size:.74rem}
.tier .tn{width:30px;height:30px;border-radius:9px;background:var(--acc,var(--deep));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0}
.tier small{display:block;font-size:.68rem;color:var(--mute);font-weight:500;letter-spacing:0;text-transform:none;margin-top:1px}
.tier::after{content:'';flex:1;height:1px;background:var(--rule)}
.cg{grid-template-columns:repeat(2,1fr)}
.cc{--acc:#1B5E20;position:relative;overflow:hidden;border-radius:16px;padding:18px 20px;box-shadow:0 4px 20px rgba(27,94,32,.08);border:1px solid #E1E9DE;animation:rise .55s both;animation-delay:calc(var(--i)*80ms);transition:transform .2s,box-shadow .2s}
.cc:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(27,94,32,.15)}
.cc::before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--acc),var(--acc2,#7CB342))}
.cc.t2{--acc:#2563EB;--acc2:#60A5FA}.cc.t3{--acc:#D97706;--acc2:#FBBF24}
.cc.wide{grid-column:span 2}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cch{align-items:center}.cch .ico{width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--acc) 12%,#fff);color:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cch .ico svg{width:20px;height:20px}.cch>div{flex:1;min-width:0;margin-left:10px}.cch b{display:block;font-size:.92rem;line-height:1.2}
.cch em{background:color-mix(in srgb,var(--acc) 10%,#fff);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 30%,#fff)}
.cc .solv{display:inline-flex;gap:6px;align-items:center;background:#F3F7F1;border:1px solid var(--rule);border-radius:20px;font-size:.66rem;font-weight:700;padding:3px 11px;color:var(--ink);margin:6px 0 10px;width:fit-content}
.cc .solv i{font-style:normal;color:var(--mute);font-weight:600}
.viz{display:flex;align-items:center;gap:18px;margin:4px 0 10px}
.cc.wide .viz{gap:36px}
.vz{flex-shrink:0;position:relative}
.vtxt{flex:1;min-width:0}
.vtxt .bg{color:var(--acc);font-size:2rem}.cc.wide .vtxt .bg{font-size:2.5rem}
.vtxt .chp{background:color-mix(in srgb,var(--acc) 12%,#fff);color:var(--acc)}
.gau .gt{fill:none;stroke:#E8EEE6;stroke-width:12;stroke-linecap:round}
.gau .gf{fill:none;stroke:var(--acc);stroke-width:12;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:gfill 1.2s .3s ease-out forwards}
@keyframes gfill{to{stroke-dashoffset:var(--off)}}
.gau text{font-family:'IBM Plex Mono',monospace;font-weight:600;fill:var(--acc);font-size:21px}
.dn .gt{fill:none;stroke:#E8EEE6;stroke-width:13}
.dn .gf{fill:none;stroke:var(--acc);stroke-width:13;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:gfill 1.2s .3s ease-out forwards;transform:rotate(-90deg);transform-origin:50% 50%}
.dn text{font-family:'IBM Plex Mono',monospace;font-weight:600;fill:var(--acc);font-size:19px}
.vb{display:flex;align-items:flex-end;gap:6px;height:84px;width:170px}
.cc.wide .vb{width:240px;height:100px}
.vb div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}
.vb i{display:block;width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 55%,#fff),var(--acc));transform-origin:bottom;animation:grow .8s .3s both}
.vb i.hl{background:linear-gradient(180deg,#FBBF24,#D97706)}
.vb span{font-size:.54rem;color:var(--mute);margin-top:3px;height:10px}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.6rem;font-weight:800;color:#15803D;letter-spacing:.08em}
.live i{width:8px;height:8px;border-radius:50%;background:#22C55E;animation:pls 1.6s infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}100%{box-shadow:0 0 0 9px rgba(34,197,94,0)}}
.spk2{width:150px;height:56px}.spk2 path.ar{fill:color-mix(in srgb,var(--acc) 14%,#fff)}.spk2 path.ln{fill:none;stroke:var(--acc);stroke-width:2.5}
.cc.wide .spk2{width:220px;height:70px}
.split{display:flex;height:34px;border-radius:9px;overflow:hidden;width:200px;font-size:.62rem;font-weight:800;color:#fff}
.cc.wide .split{width:280px}
.split div{display:flex;align-items:center;justify-content:center;animation:grow2 .8s .3s both;transform-origin:left}
@keyframes grow2{from{transform:scaleX(0)}to{transform:none}}
.cmp{display:flex;flex-direction:column;gap:7px;width:200px}.cc.wide .cmp{width:280px}
.cmp>div{font-size:.62rem;font-weight:700;display:flex;gap:8px;align-items:center}.cmp b{width:78px;font-weight:700;color:var(--mute)}
.cmp u{display:block;height:16px;border-radius:5px;text-decoration:none;color:#fff;padding:0 7px;line-height:16px;animation:grow2 .8s .3s both;transform-origin:left}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;border-top:1px solid var(--rule);padding-top:8px}
.cs .rb2 i{background:var(--acc)}
.ccf{border-top:none;padding-top:6px}.ccf a{color:var(--acc);text-decoration:none;font-weight:700;display:inline-flex;gap:5px;align-items:center}.ccf a:hover{text-decoration:underline}
.agr{width:100%;height:170px;margin:8px 0}
.agr .ar{fill:rgba(27,94,32,.12)}.agr .ln{fill:none;stroke:var(--deep);stroke-width:3;stroke-linejoin:round}.agr .gd{stroke:#E4EAE2;stroke-width:1}.agr text{font-size:10px;fill:#5F6F62}.agr circle{fill:#fff;stroke:var(--deep);stroke-width:2.5}
.dtb{width:100%;border-collapse:collapse;font-size:.74rem;margin-top:6px}.dtb th{text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:6px 4px;border-bottom:1.5px solid var(--rule)}.dtb td{padding:7px 4px;border-bottom:1px solid var(--rule)}.dtb td.n{font-family:'IBM Plex Mono',monospace;text-align:right}
@media(max-width:1020px){.lcgrid{grid-template-columns:1fr}.rcol{position:static}.cg{grid-template-columns:1fr}.cc.wide{grid-column:auto}.viz{flex-direction:column;align-items:flex-start}.cs{grid-template-columns:1fr}}
.cover .tag5{font-size:1.25rem;font-weight:700;color:#B6DB8A;margin:10px auto 14px;max-width:560px;text-align:center}</style>
</head>

function draw(){
 var nav=document.querySelector(".nav"),pr=$("prog");
 if(st.cover){pr.style.display="none";nav.style.display="none";$("stage").innerHTML=cover();window.scrollTo({top:0});return}
 pr.style.display="";nav.style.display="";
 var h="";STEPS.forEach(function(n,i){h+='<button class="pstep '+(i<st.step?'done ':'')+(i===st.step?'on':'')+'" data-s="'+i+'"><div class="bar"><i></i></div><div class="nm">'+(i+1)+'. '+n+'</div></button>'});
 pr.innerHTML=h;
 var R=[r1,r2,r3,r4,r5,r6];
 $("stage").innerHTML='<div class="fade">'+R[st.step]()+'</div>';
 $("bk").style.visibility="visible";
 $("nx").style.display=st.step===5?"none":"";
 $("cnt").textContent="Step "+(st.step+1)+" of 6";if(st.step>MAXSTEP){MAXSTEP=st.step;rec("step",{step:st.step+1})}
 if(st.step===2)drawPipe(-1);
 window.scrollTo({top:0});
}
function go(n){clearInterval(st.timer);$("drw").className="drw";$("mdl").className="drw";if(n<0){st.cover=true;draw();return}st.step=Math.min(5,n);if(st.step!==5)st.s6={v:"home"};draw()}
$("bk").onclick=function(){go(st.step-1)};
$("nx").onclick=function(){go(st.step+1)};
document.addEventListener("click",function(e){
 var t=e.target.closest("#start,[data-s],[data-flow],[data-act],[data-go],[data-tl],[data-dash],[data-tr],[data-pd],[data-dv],[data-day],[data-call],[data-drill],[data-close],[data-lang],[data-sz],#play,#trb");if(!t)return;
 var s6=st.s6;
 if(t.id==="start"){st.cover=false;st.step=0;draw();return}
 if(t.id==="trb"){var tr=$("tr");tr.classList.toggle("on");t.textContent=tr.classList.contains("on")?"Hide transcript":"Show transcript";return}
 if(t.dataset.close){$("drw").className="drw";$("mdl").className="drw";return}
 if(t.dataset.dv){st.dv=t.dataset.dv;draw();return}
 if(t.dataset.tr){st.tr=t.dataset.tr;draw();return}
 if(t.dataset.pd){st.pd=t.dataset.pd;draw();return}
 if(t.dataset.day!==undefined){showDay(+t.dataset.day);return}
 if(t.dataset.call!==undefined){openCall(+t.dataset.call);return}
 if(t.dataset.drill){openDrill(t.dataset.drill);return}
 if(t.dataset.lang){st.lang=t.dataset.lang;draw();return}
 if(t.dataset.sz){var k=t.dataset.sz;st.sz[k]=st.sz[k]||{};st.sz[k].ok=t.dataset.v==="ok";rec("sizing",{k:k,ok:st.sz[k].ok,nv:st.sz[k].nv||""});var y=window.scrollY;draw();window.scrollTo({top:y});return}
 if(t.dataset.s!==undefined){go(+t.dataset.s);return}
 if(t.dataset.flow){st.flow=allFlows().filter(function(f){return f.id===t.dataset.flow})[0];clearInterval(st.timer);draw();return}
 if(t.id==="play"){rec("call",{flow:st.flow.id,lang:st.lang});play();return}
 if(t.dataset.go){s6.v=t.dataset.go;draw();return}
 if(t.dataset.tl){s6.tl=t.dataset.tl;rec("timeline",{tl:s6.tl});draw();return}
